[package]
name = "astrohud-provisioner"
version = "0.1.0"
edition = "2024"

[dependencies]
font8x8 = "0.3"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
