# Resolve every name to the local portal while the NetworkManager shared
# connection is active. Normal station-mode DNS is unaffected because the
# shared dnsmasq instance only exists during setup mode.
address=/#/10.42.0.1
# This setup-only resolver has no internet path. Do not inherit the household
# resolver from /etc/resolv.conf, which can override the catch-all local rule.
no-resolv
# dnsmasq >= 2.86 forwards other record types (AAAA, HTTPS/SVCB) upstream
# unless these names are also local. Setup has no upstream internet: answer
# those with local NODATA so phones can detect the portal without DNS timeouts.
local=/#/
# Option 114 identifies an HTTPS Captive Portal API, not this HTTP HTML page.
# Use wildcard DNS and HTTP probe redirects; the TV also shows 10.42.0.1.
