[package]
name = "astrohud-rest"
version = "0.1.0"
edition = "2024"
default-run = "astrohud-rest"

[dependencies]
actix = "0.13.5"
actix-web = "4.9.0"
actix-web-actors = "4"
actix-files = "0.6"
actix-multipart = "0.7"
bytes = "1.10"  # For handling binary data
derive = "1.0.0"
features = "0.10.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
infer = "0.19"  # handle "infer" different image types
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6.1"
qrcode = { version = "0.14", default-features = false }
