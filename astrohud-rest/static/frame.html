<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070c">
  <title>AstroHUD Frame</title>
  <link rel="stylesheet" href="/astrohud-theme.css">
</head>
<body class="frame-view">
  <img id="photo" class="frame-photo" alt="Shared photograph">
  <div class="frame-telemetry" aria-hidden="true">
    <div class="frame-brand">AH / AstroHUD</div>
    <div id="link" class="frame-link" data-online="true"><i class="status-light"></i><span>Signal ready</span></div>
  </div>
  <div id="empty" class="frame-empty" role="status">
    <section class="empty-console">
      <p class="signal-label">Display channel / Standing by</p>
      <h1>AstroHUD</h1>
      <p>Waiting for the first shared moment. The display will update automatically.</p>
    </section>
  </div>
  <div id="place" class="frame-place"></div>
  <script>
    const frameId = new URLSearchParams(location.search).get('frame') || 'demo-frame';
    const photo = document.querySelector('#photo');
    const empty = document.querySelector('#empty');
    const place = document.querySelector('#place');
    const link = document.querySelector('#link');
    let photos = [], current = -1, signature = '';

    function setLink(online) {
      link.dataset.online = String(online);
      link.querySelector('span').textContent = online ? 'Signal ready' : 'Signal degraded / Retrying';
    }

    async function refresh() {
      const response = await fetch(`/api/frames/${encodeURIComponent(frameId)}/manifest`, {cache: 'no-store'});
      if (!response.ok) throw new Error(await response.text());
      const manifest = await response.json();
      setLink(true);
      place.textContent = manifest.place_name;
      const nextSignature = manifest.photos.map(item => item.id).join(',');
      if (nextSignature !== signature) {
        signature = nextSignature;
        photos = manifest.photos;
        current = -1;
        if (photos.length) showNext();
      }
      empty.hidden = photos.length > 0;
    }

    function showNext() {
      if (!photos.length) return;
      current = (current + 1) % photos.length;
      photo.classList.remove('ready');
      const next = new Image();
      next.onload = () => {
        photo.src = next.src;
        photo.classList.add('ready');
        empty.hidden = true;
      };
      next.src = photos[current].url;
    }

    function refreshWithRecovery() {
      refresh().catch(error => {
        setLink(false);
        console.error(error);
      });
    }

    refreshWithRecovery();
    setInterval(refreshWithRecovery, 3000);
    setInterval(showNext, 12000);
  </script>
</body>
</html>
