<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070c">
  <title>Memory Lane Frame</title>
  <link rel="stylesheet" href="/astrohud-theme.css?v=a271caa4fb0c">
</head>
<body class="frame-view">
  <div id="backdrop" class="photo-backdrop" aria-hidden="true"></div>
  <img id="photo" class="frame-photo" alt="Shared photograph">
  <div class="frame-telemetry" aria-hidden="true">
    <div class="frame-brand">ML / Memory Lane</div>
    <div id="link" class="frame-link" data-online="true"><i class="status-light"></i><span>Signal ready</span></div>
  </div>
  <div id="empty" class="frame-empty" role="status">
    <section class="empty-console">
      <p class="signal-label">Display channel / Standing by</p>
      <h1>Memory Lane</h1>
      <p>Waiting for the first shared moment. The display will update automatically.</p>
    </section>
  </div>
  <div id="place" class="frame-place"></div>
  <script src="/display.js?v=1723a0cf2626"></script>
  <script>
    const frameId = new URLSearchParams(location.search).get('frame') || 'demo-frame';
    const slideshow = new MemoryLaneSlideshow(document.querySelector('#photo'), document.querySelector('#backdrop'), document.querySelector('#empty'));
    const link = document.querySelector('#link');
    async function refresh() {
      try {
        const response = await fetch(`/api/frames/${encodeURIComponent(frameId)}/manifest`, {cache:'no-store'});
        if (!response.ok) throw new Error('Frame unavailable');
        const manifest = await response.json();
        document.querySelector('#place').textContent = manifest.place_name;
        await slideshow.update(manifest);
        link.dataset.online = 'true'; link.querySelector('span').textContent = 'Signal ready';
      } catch (_) { link.dataset.online = 'false'; link.querySelector('span').textContent = 'Signal degraded / Retrying'; }
    }
    refresh(); setInterval(refresh, 3000);
  </script>
</body>
</html>
