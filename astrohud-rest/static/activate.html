<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070910">
  <title>Activate Memory Lane</title>
  <link rel="stylesheet" href="/astrohud-theme.css?v=4bb79127b5bf">
</head>
<body class="simple-page">

  <main class="hud-shell sender-main">
    <header class="sender-intro">
      <div class="page-heading"><a class="home-button" href="/owner.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg><span>Home</span></a><h1>Memory Lane</h1></div>
      <p id="message">Checking this private activation link…</p>
      <p>After activation, save a private recovery link from Device settings. You can use it to restore owner access on another phone, tablet, or computer.</p>
    </header>
    <p id="status" class="status-line" data-state="sending" role="status">Activation in progress.</p>
  </main>

  <script>
    const message = document.querySelector('#message');
    const status = document.querySelector('#status');

    async function activate() {
      const token = location.hash.slice(1);
      history.replaceState(null, '', '/activate.html');
      if (!token) throw new Error('This activation link is incomplete. Open the original private link containing its # token in this browser.');
      const response = await fetch('/api/beta/owner/session', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({token})
      });
      if (!response.ok) throw new Error('This activation link is invalid or no longer active.');
      location.replace('/owner.html');
    }

    activate().catch(error => {
      message.textContent = 'We could not activate owner access.';
      status.textContent = error.message;
      status.dataset.state = 'error';
    });
  </script>
  <footer class="site-footer"><small>© 2026 <a href="https://advanceddatamachines.com/">Advanced Data Machines, LLC</a><span> d/b/a Santamatronic Labs</span></small></footer>
</body>
</html>
