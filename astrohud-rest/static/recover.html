<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070910">
  <meta name="referrer" content="no-referrer">
  <title>Restore owner access — Memory Lane</title>
  <link rel="stylesheet" href="/astrohud-theme.css?v=bae44a29ab21">
</head>
<body class="owner-page simple-page">
  <main class="hud-shell sender-main">
    <header class="sender-intro">
      <div class="page-heading"><a class="home-button" href="/owner.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg><span>Home</span></a><h1>Restore access</h1></div>
      <p>Restore access to your existing household, frames, and photos in this browser.</p>
    </header>
    <section class="instrument-panel">
      <p id="message">Use this saved private recovery link on any of your devices. Owner access will be saved in this browser.</p>
      <button id="restore-access" class="signal-button" type="button">Restore owner access</button>
    </section>
    <p id="status" class="status-line" role="status">Ready to restore owner access.</p>
  </main>
  <script>
    const token = location.hash.slice(1);
    history.replaceState(null, '', '/recover.html');
    const button = document.querySelector('#restore-access');
    const status = document.querySelector('#status');
    if (!/^[a-f0-9]{64}$/.test(token)) {
      button.hidden = true;
      status.textContent = 'Open the complete private recovery link saved in your password manager or secure notes.';
      status.dataset.state = 'error';
    }
    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = 'Restoring owner access…';
      try {
        const response = await fetch('/api/beta/owner/recovery/session', {
          method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({token})
        });
        if (!response.ok) {
          if (response.status === 401 || response.status === 400) {
            throw new Error('This recovery link is invalid, expired, or has been replaced. Use the most recent saved link, or create a new one from a browser where you still have owner access.');
          }
          throw new Error('The service is unavailable. Keep your saved recovery link and try again shortly.');
        }
        location.replace('/owner.html');
      } catch (error) {
        status.textContent = error.message;
        status.dataset.state = 'error';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
