<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070910">
  <title>Open Memory Lane invitation</title>
  <link rel="stylesheet" href="/astrohud-theme.css?v=a271caa4fb0c">
</head>
<body class="simple-page">

  <main class="hud-shell sender-main">
    <header class="sender-intro">
      <div class="page-heading"><a class="home-button" href="/owner.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/></svg><span>Home</span></a><h1>Memory Lane</h1></div>
      <p id="message">Checking this private photo invitation…</p>
      <p>For reliable access, open this complete link in Safari or Chrome and keep using that browser when choosing your photo.</p>
    </header>
    <p id="status" class="status-line" data-state="sending" role="status">Secure link in progress.</p>
  </main>

  <script>
    const message = document.querySelector('#message');
    const status = document.querySelector('#status');

    async function activate() {
      const token = location.hash.slice(1);
      history.replaceState(null, '', '/sender-activate.html');
      if (!token) throw new Error('This invitation link is incomplete. Ask the frame owner to resend the complete private link containing its # token.');
      const response = await fetch('/api/beta/sender/session', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({token})
      });
      if (!response.ok) throw new Error('This invitation is invalid or has been disabled by the frame owner.');
      location.replace('/send.html');
    }

    activate().catch(error => {
      message.textContent = 'We could not open this photo invitation.';
      status.textContent = error.message;
      status.dataset.state = 'error';
    });
  </script>
  <footer class="site-footer"><small>© 2026 <a href="https://advanceddatamachines.com/">Advanced Data Machines, LLC</a><span> d/b/a Santamatronic Labs</span></small></footer>
</body>
</html>
